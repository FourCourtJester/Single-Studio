# Publish the framework packages to npm.
#
# Tag-driven rather than push-driven. A version is a promise somebody else's build
# will hold you to, so it should be a deliberate act -- `git tag v0.1.0 && git push
# --tags` -- rather than something that happens because a commit landed.
#
# The tag has to match the version in package.json. Checking that here rather than
# trusting it is worth the six lines: the failure it prevents is a tarball published
# under a version number nobody can find the source for, and npm does not let you
# take a version back.
name: Release

on:
  push:
    tags: ['v*']
  # Run by hand and nothing is published: every publishing step is gated on the ref
  # being a tag. That makes a manual run a rehearsal -- lint, test, build, and the
  # template built against packed tarballs -- which is the thing worth doing before
  # cutting a version you cannot take back.
  workflow_dispatch:
    inputs:
      check_template_key:
        description: 'Also check the template deploy key can write (pushes and deletes a scratch tag)'
        type: boolean
        default: false

permissions:
  contents: read
  # npm provenance: the published package carries a signed link back to the commit
  # and workflow that built it, so anybody can check the tarball came from here.
  id-token: write

# Everything that goes to the registry, in dependency order: the plugins name core as
# a peer, so a release where core is missing is a release where four packages cannot
# be installed.
#
# They share one version deliberately. A plugin's peer range has to name a core that
# exists, and four ranges maintained separately are four chances for one of them to
# name a version that was never published -- which npm reports at somebody else's
# install, not at ours. Lockstep costs a version bump on a plugin that did not change
# and buys a range that is always right.
env:
  PACKAGES: >-
    packages/core
    packages/provider-supabase
    packages/plugin-obs
    packages/plugin-sheets
    packages/plugin-twitch
    packages/plugin-rocket-league

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      # Deliberately no `registry-url`. It exists to write an .npmrc containing
      # `${NODE_AUTH_TOKEN}`, and with no token to expand that placeholder to, the
      # line is at best noise and at worst something pnpm trips over. OIDC needs
      # none of it, and the default registry is the one being published to.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for dir in $PACKAGES; do
            version=$(node -p "require('./$dir/package.json').version")
            if [ "$tag" != "$version" ]; then
              echo "::error::$dir is $version but the tag says $tag"
              exit 1
            fi
          done

      # The publish rehearsal: pack the packages and build the starter template
      # against the tarballs. Catches a broken `files` or `exports` here, where it
      # costs a red build, rather than on npm, where it costs a version number.
      - run: node scripts/verify-template.mjs

      # `npm publish`, not `pnpm publish`, and npm upgraded first.
      #
      # Trusted publishing is npm's own feature and the npm CLI is where it is
      # actually implemented -- pnpm 10.33 does not perform the OIDC exchange at
      # all. That is not a subtle failure: it looks for a token, finds none, and
      # stops on ENEEDAUTH without a single line about OIDC, which reads exactly
      # like a missing credential and is not one.
      #
      # The upgrade is load-bearing too. Node 22 ships npm 10, and OIDC publishing
      # needs npm 11.5.1 or newer, so the npm that comes with the runner would fail
      # the same way for a different reason.
      #
      # pnpm still owns install and build. This is only about who talks to the
      # registry, and that is the one job it has repeatedly got wrong here.
      #
      # Provenance is asked for only when the source repository is public, because
      # that is the only case npm accepts it in: a private repository gets
      # `422 Unsupported GitHub Actions source repository visibility`. Which is the
      # honest reason 0.1.0 and 0.1.1 came out unsigned -- not a missing flag, as it
      # looked at the time, but a signature that could not have been issued.
      #
      # Written as a condition rather than as a decision, so nothing has to be
      # remembered: the day this repository goes public, releases start being signed
      # on their own.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          npm install -g npm@latest
          npm --version

          if [ "$PRIVATE" = "true" ]; then
            # Said out loud rather than passed over. An unsigned release is a real
            # thing to know about a package, and the fix is one repository setting.
            echo "::warning::Publishing without provenance: npm only signs releases whose source repository is public, and this one is private."
            provenance=""
          else
            provenance="--provenance"
          fi

          # One at a time, and deliberately not `npm publish --workspaces`: this is
          # a pnpm workspace, npm cannot see it, and each package is an ordinary
          # standalone publish from its own directory. `prepack` still runs, so
          # core's dist is built here exactly as it is everywhere else.
          for dir in $PACKAGES; do
            echo "::group::publishing $dir"
            (cd "$dir" && npm publish --access public $provenance)
            echo "::endgroup::"
          done

  # Push each template to its own repository, so what people click "Use this
  # template" on is what CI just verified.
  #
  # Neither template is independent of the framework the way the demo is: their
  # source calls the components and base classes by name, so an API change here
  # forces a change there. 0.2.0 alone moved every import to /control and /source,
  # renamed ToggleButton, and changed what `swap` and `group` mean; 0.6.0 renamed two
  # plugin handlers and moved cross-plugin calls into the framework. A template
  # repository that missed any of that would hand somebody a project that does not
  # compile, and nothing would say so -- verify-template.mjs would keep passing here,
  # against the copy nobody uses.
  #
  # So they are copied on release rather than by hand. This repository stays
  # authoritative; the template repositories are published mirrors.
  template:
    # Only once the packages are actually on npm. A template pinned to a version
    # that does not exist is worse than one that is a release behind.
    needs: publish
    if: startsWith(github.ref, 'refs/tags/') || inputs.check_template_key
    runs-on: ubuntu-latest
    # A matrix rather than a second job, because everything below is the same
    # reasoning and the failures are the same failures. Two copies would be two
    # places for the deploy-key trap and the workflow-scope trap to be relearned.
    #
    # `fail-fast: false` so a missing key on one does not hide the state of the
    # other -- on a manual check run, knowing that both are wrong beats finding out
    # twice.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: studio
            source: templates/studio
            repository: FourCourtJester/Single-Studio-Template
            secret: TEMPLATE_DEPLOY_KEY
          - name: plugin
            source: templates/plugin
            repository: FourCourtJester/Single-Studio-Plugin-Template
            secret: PLUGIN_TEMPLATE_DEPLOY_KEY
    steps:
      - uses: actions/checkout@v5

      # A deploy key rather than a token, for three reasons that all matter here.
      #
      # GITHUB_TOKEN cannot do it at all -- it is scoped to this repository alone.
      # A personal access token could, but it acts as whoever minted it, expires on
      # a schedule somebody has to remember, and grants whatever that person can
      # reach rather than this one repository.
      #
      # The third reason is the one that decides it. The template contains
      # .github/workflows/pages.yml, and GitHub refuses any push from an OAuth or
      # GitHub App credential that creates or updates a workflow file unless it
      # carries the `workflow` scope -- the "refusing to allow an OAuth App to
      # create or update workflow" rejection. SSH is not subject to that rule, so a
      # deploy key sidesteps a trap that is invisible until the release fails.
      - name: Check the deploy key is there before doing anything
        env:
          KEY: ${{ secrets[matrix.secret] }}
          SECRET: ${{ matrix.secret }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::$SECRET is not set. The packages published; the ${{ matrix.name }} template was not synced. See docs/internal/releasing.md."
            exit 1
          fi

      - name: Check out the template repository
        uses: actions/checkout@v5
        with:
          repository: ${{ matrix.repository }}
          ssh-key: ${{ secrets[matrix.secret] }}
          path: .mirror

      # Replace the contents rather than merge them, so a file deleted here is
      # deleted there. `.git` is held back for the obvious reason, and `cp -a` of
      # `.` rather than `*` is what carries .gitignore and .github across.
      - name: Copy the template across
        run: |
          find .mirror -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a ${{ matrix.source }}/. .mirror/

      # A manual run proves the credential and changes nothing. Read access is
      # already proven by the checkout above; this is the other half, and it is the
      # half that actually fails -- a deploy key added without ticking "Allow write
      # access" clones perfectly and refuses to push.
      #
      # A scratch tag pushed and immediately deleted is a real write against the
      # real remote, which is the only thing that answers the question, and it
      # leaves nothing behind.
      - name: Check the deploy key can write
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: .mirror
        run: |
          scratch="refs/tags/template-sync-check-${GITHUB_RUN_ID}-${{ matrix.name }}"

          if ! git push origin "HEAD:$scratch"; then
            echo "::error::The deploy key cannot write. Add it to ${{ matrix.repository }} with 'Allow write access' ticked."
            exit 1
          fi

          git push origin --delete "$scratch"
          echo "The deploy key can write, and the scratch tag has been removed."

          echo "::group::what a real release would change"
          git status --short || true
          echo "::endgroup::"

      - name: Commit, push, and tag
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .mirror
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          # An unchanged template is the normal case between releases that only
          # touch the framework's internals, and an empty commit every time would
          # bury the ones that mean something.
          if git diff --cached --quiet; then
            echo "the ${{ matrix.name }} template is unchanged since the last release"
          else
            git commit -m "Sync from Single-Studio ${VERSION}"
            # Never force. The template repository's history is its own -- v0-cra
            # holds the create-react-app generation, and this only ever adds to it.
            git push origin HEAD:main
          fi

          # Tagged either way, so "which template goes with 0.2.0" has an answer
          # even when the template did not change between releases.
          git tag -f "$VERSION"
          git push -f origin "refs/tags/$VERSION"
