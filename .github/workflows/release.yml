# Publish the framework packages to npm.
#
# Tag-driven rather than push-driven. A version is a promise somebody else's build
# will hold you to, so it should be a deliberate act -- `git tag v0.1.0 && git push
# --tags` -- rather than something that happens because a commit landed.
#
# The tag has to match the version in package.json. Checking that here rather than
# trusting it is worth the six lines: the failure it prevents is a tarball published
# under a version number nobody can find the source for, and npm does not let you
# take a version back.
name: Release

on:
  push:
    tags: ['v*']
  # Run by hand and nothing is published: every publishing step is gated on the ref
  # being a tag. That makes a manual run a rehearsal -- lint, test, build, and the
  # template built against packed tarballs -- which is the thing worth doing before
  # cutting a version you cannot take back.
  workflow_dispatch:

permissions:
  contents: read
  # npm provenance: the published package carries a signed link back to the commit
  # and workflow that built it, so anybody can check the tarball came from here.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Deliberately no `registry-url`. It exists to write an .npmrc containing
      # `${NODE_AUTH_TOKEN}`, and with no token to expand that placeholder to, the
      # line is at best noise and at worst something pnpm trips over. OIDC needs
      # none of it, and the default registry is the one being published to.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for dir in packages/core packages/provider-supabase; do
            version=$(node -p "require('./$dir/package.json').version")
            if [ "$tag" != "$version" ]; then
              echo "::error::$dir is $version but the tag says $tag"
              exit 1
            fi
          done

      # The publish rehearsal: pack the packages and build the starter template
      # against the tarballs. Catches a broken `files` or `exports` here, where it
      # costs a red build, rather than on npm, where it costs a version number.
      - run: node scripts/verify-template.mjs

      # No token. npm authenticates this publish over OIDC -- the `id-token: write`
      # permission above is the whole credential, and it is minted per run, scoped
      # to this workflow, and expired minutes later. There is nothing to rotate,
      # nothing to leak, and nothing for a compromised dependency to read.
      #
      # It is also the only path with a future. The bypass-2FA token that published
      # 0.1.0 was already living on borrowed time: since August 2026 such a token
      # cannot manage the account, and from around January 2027 it cannot publish
      # directly at all.
      #
      # Provenance comes along automatically, which is why `--provenance` is gone
      # rather than kept -- it was passed explicitly for 0.1.0 and produced no
      # attestation, because a token publish cannot sign one.
      #
      # Each package needs a Trusted Publisher on npmjs.com naming this repository
      # and this file. Without it the publish fails on authentication, and the fix
      # is a settings page rather than anything in here.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        run: pnpm -r --filter "./packages/*" publish --access public --no-git-checks
