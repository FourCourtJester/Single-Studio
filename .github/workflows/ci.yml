name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    # Pinned, not ubuntu-latest. GitHub began moving ubuntu-latest to Ubuntu 26 on
    # 2026-10-19, and Playwright knows the system packages for Ubuntu 20.04, 22.04
    # and 24.04 only: on 26 it names the host ubuntu26.04-x64, has no package list
    # for it, and `install-deps` fails in seconds. On PR #70, 2026-10-27, both
    # pull_request runs failed that way three attempts running while the push runs
    # beside them passed. Move to the next LTS when Playwright supports it.
    runs-on: ubuntu-24.04
    # A healthy run is about 4 minutes. Without a limit GitHub allows 360, and on
    # 2026-10-23 three runs hung in the Chromium install for 7-10 minutes each,
    # holding a pull request until somebody noticed and cancelled. The install has
    # its own retries below; this is only the floor under everything else.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # No version here on purpose: the action reads "packageManager" from
      # package.json, so CI and the devcontainer cannot drift apart.
      #
      # Every action in this repository is pinned to a major that runs on Node 24.
      # Node 20 leaves the runners on 16 September 2026, and until then a node20
      # action is force-run on 24 regardless -- so the deadline is not the day they
      # break, it is the day they stop being warned about and start being absent.
      #
      # Bumped to the *lowest* major on 24 rather than the newest available. The
      # job is getting off a retired runtime, not chasing releases, and a smaller
      # diff is one CI can actually vouch for.
      #
      # So Dependabot's actions PR is a suggestion to check, not to take. Measured
      # rather than assumed, the last time it offered one: checkout, setup-node and
      # pnpm/action-setup were all already on node24 at v5, and the newer majors it
      # proposed bought nothing. The one that mattered was in pages.yml and looked
      # like the least urgent of the four -- see the note there.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # `pnpm test` builds core first, and has to. The plugin packages import the
      # framework through its public entry points rather than by relative path --
      # which is the point, since that is the surface a studio author gets -- so
      # they resolve through `dist`, and a clean checkout has none. Reordering these
      # two steps is not a fix; the script is what a contributor runs locally too.
      - run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Build demo studio
        run: pnpm fixture:build

      # The demo, typechecked against the framework's own types. It is the only
      # thing that notices a studio still passing a prop the framework has removed:
      # a lowercase one like `retries` is handed straight to the DOM by React with
      # no warning at all, so it builds, renders, passes every end-to-end check, and
      # does nothing.
      - name: Typecheck the demo studio
        run: node node_modules/typescript/bin/tsc -p apps/fixture/tsconfig.json

      # The reference is generated from the shipped types, so a renamed prop that
      # nobody thought to document is a red build rather than a page that quietly
      # describes a component which no longer exists.
      - name: Check the component reference is current
        run: node scripts/api-reference.mjs --check

      # The starter template, built the way a stranger gets it: from packed
      # tarballs, in a directory with no workspace to fall back on. The demo cannot
      # answer this -- it resolves the framework through `workspace:*`, which
      # reaches the whole package directory regardless of what `files` says, so it
      # would keep building for years after `dist` fell out of the published
      # tarball. See scripts/verify-template.mjs.
      - name: Verify the starter template
        run: node scripts/verify-template.mjs

      # Integration coverage for the parts that only exist in a browser:
      # SharedWorker startup, cross-tab BroadcastChannel fan-out, IndexedDB.
      #
      # The browser is cached, keyed on Playwright's version, so most runs do not
      # download it at all. The download is what hung: three times on 2026-10-23,
      # 7-10 minutes each against 20-27 seconds healthy, and a re-run on another
      # runner always went straight through. So each attempt gets two minutes and
      # three tries, and a stall costs two minutes rather than a cancelled run.
      # The system packages (`install-deps`) still install every run -- they are
      # not in the cache path -- under the same retries.
      - name: Find Playwright's version
        id: playwright
        run: echo "version=$(apps/fixture/node_modules/.bin/playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        timeout-minutes: 8
        env:
          CACHED: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          if [ "$CACHED" = true ]; then what='install-deps chromium'; else what='install --with-deps chromium'; fi

          # Which Ubuntu, in the log and as a notice, so a failure here says
          # whether it is the runner image rather than leaving that to be guessed.
          echo "::notice title=runner::$(. /etc/os-release && echo "$PRETTY_NAME")"

          for attempt in 1 2 3; do
            # `timeout` signals the whole process group, so a hung apt-get under
            # sudo goes with Playwright rather than holding the dpkg lock.
            if timeout --kill-after=10 120 apps/fixture/node_modules/.bin/playwright $what 2>&1 | tee "$RUNNER_TEMP/chromium.log"; [ "${PIPESTATUS[0]}" -eq 0 ]; then exit 0; fi
            # Playwright's own last error, as the annotation: the job log is not
            # always readable from where a failure is diagnosed.
            said=$(grep -iE 'error|not support|unable|failed' "$RUNNER_TEMP/chromium.log" | tail -1 | cut -c1-200)
            echo "::warning::Chromium install attempt $attempt failed or stalled: ${said:-no error printed}"
            sleep $((attempt * 10))
          done

          echo "::error::Chromium did not install in three attempts"
          exit 1

      - name: Smoke test
        working-directory: apps/fixture
        run: |
          pnpm preview --port 4173 &
          npx wait-on http://localhost:4173 --timeout 60000
          pnpm e2e http://localhost:4173
