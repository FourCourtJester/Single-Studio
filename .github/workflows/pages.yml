# Publish the documentation site to GitHub Pages.
#
# The landing page and the docs, not a studio. A studio to look at lives at
# Single-Studio-Demo and is maintained there; apps/fixture is the test rig and has no
# business being published as if it were a showcase.
#
# Built from docs/ with VitePress, which renders the same markdown the repository
# already has -- so nothing is written twice, and api.md in particular is regenerated
# from the shipped types before every build rather than kept as a second edition.
#
# Separate from ci.yml on purpose. CI runs on every branch and every pull request
# and is allowed to fail loudly; this runs on the default branch only, holds the
# Pages deployment token, and has one job: put a working board at a URL somebody
# can open. Folding the two together would mean every pull request carried write
# access to the published site.
name: Pages

on:
  push:
    branches: [main]
  # So a deploy can be re-run without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # deploy-pages authenticates with OIDC rather than a stored secret.
  id-token: write

# One deploy at a time, and a newer commit wins. `cancel-in-progress: false` so a
# deploy that is already uploading finishes rather than leaving Pages half-written.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No version here on purpose: the action reads "packageManager" from
      # package.json, so this and the devcontainer cannot drift apart.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Builds the framework packages first, because docs:build regenerates api.md
      # from the emitted types before VitePress renders anything. A site built
      # without that step would publish whatever api.md happened to be committed.
      - run: pnpm build
      - run: pnpm docs:build

      # `base: '/Single-Studio/'` in the VitePress config is what makes this work at
      # a project-site subpath. If this ever moves to a custom domain, that is the
      # one line to change.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
