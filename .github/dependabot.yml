# Scheduled version updates.
#
# Security *alerts* are a separate mechanism and are already on: they arrive when an
# advisory lands, whatever is written here. This file is only about the other kind of
# update -- the routine drift that nobody is paged for and everybody puts off, which
# is how a six-month gap becomes a frightening one.
#
# Monthly and grouped on purpose. Weekly and ungrouped is how a repository ends up
# with eleven open Dependabot PRs nobody reads, which is worse than no Dependabot at
# all: the alerts that matter arrive in the same inbox as the ones that do not.
#
# That happened anyway, in October 2026: thirteen in one night. Not from weekly runs
# but from five entries each opening their own -- the same yjs patch three times,
# react-router and vite twice each, because the demo and both templates were separate
# entries. They are one entry now, grouped by dependency name across all three.
#
# Every entry waits a week before offering a release. Most bad publishes -- a broken
# build, a hijacked account -- are pulled within days, and nothing here needs a
# release in its first week. Dependabot's own default is three days. Security updates
# ignore the wait, which is the point: this delays routine drift, not fixes.
version: 2

updates:
  # The workspace. One entry covers packages/* and apps/* -- pnpm keeps a single
  # lockfile at the root, so that is where every workspace dependency is resolved.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Move the lockfile, and a range only when the new release falls outside it.
    #
    # The root manifest is private, so Dependabot's default took this for an app and
    # raised every floor to the release it was offering: yjs went from ^13.6.20 to
    # ^13.6.33 in core, provider-supabase and relay (#49), supabase-js likewise
    # (#52). Those ranges are what every studio installing us has to satisfy, and
    # nothing we ship needed the newer floor. CI still tests the newest release,
    # because the lockfile moves either way.
    #
    # The cost: a security fix in a runtime dependency also stops at the lockfile.
    # A fresh install picks it up through the caret regardless; raise the floor by
    # hand when the advisory says older versions must not be installed at all.
    versioning-strategy: increase-if-necessary
    groups:
      # Everything that only builds and tests this repository: React, vite, vitest,
      # eslint, TypeScript. None of it reaches a studio -- it is not in any published
      # package's `dependencies` -- so it moves as one PR that the browser suite
      # either passes or does not.
      #
      # Majors are deliberately left out of the group. A major devDependency is a
      # day's work with its own reasoning (vitest 5, React 19), and burying one in a
      # batch of patches is how it ships unread.
      toolchain:
        dependency-type: development
        update-types:
          - minor
          - patch

    # Runtime dependencies are deliberately *not* grouped, so each arrives as its own
    # PR with its own changelog to read. There are only five across all six published
    # packages, and every one of them is imposed on everybody who installs us:
    #
    #   core                yjs, y-indexeddb
    #   provider-supabase   @supabase/supabase-js, lib0, y-protocols
    #
    # `yjs` is the one to slow down for. It is the CRDT -- the persistence format in
    # IndexedDB and the wire format between machines -- so a major there is a data
    # migration for every studio with an existing show, not a dependency bump.

  # The demo and both starter templates. Outside the pnpm workspace and carrying no
  # lockfile, so the root entry above cannot see them, and a template left to drift
  # is how a new studio starts a release behind on its first `pnpm install`.
  #
  # One entry for all three because they depend on the same things -- React, vite,
  # yjs, react-router -- and a release of any of them is one decision, not three.
  # `pnpm verify:template` builds all three against packed tarballs on every PR, so
  # one PR touching all three gets the same coverage three did.
  #
  # No `versioning-strategy`: with no lockfile, the range *is* the only thing to move.
  - package-ecosystem: npm
    directories:
      - /demo
      - /templates/studio
      - /templates/plugin
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # vite and its React plugin are one decision, not two. @vitejs/plugin-react@6
      # peers vite ^8, so the plugin arriving on its own is a broken peer and vite
      # arriving on its own is half a move -- which is exactly what happened: #23 and
      # #24 were the same change, split, and merging either alone was wrong.
      #
      # First, so it claims vite before the group below does: a dependency goes to
      # the first group it matches.
      vite:
        patterns:
          - 'vite'
          - '@vitejs/*'
      # Each other dependency once, across all three directories. Minors and patches
      # only, for the same reason as the toolchain group above: a major arrives on its
      # own, per directory, to be read.
      same-everywhere:
        group-by: dependency-name
        update-types:
          - minor
          - patch
    ignore:
      # The framework's own pins. Those are release-managed -- see docs/internal/
      # releasing.md -- and verify-template fails a pull request that lets them fall
      # behind, so a bot bumping them would only race the release that sets them.
      - dependency-name: '@single-studio/*'

  # Actions. These move rarely, so one grouped PR a month is mostly a no-op and
  # occasionally the thing that says a runner deprecation is coming.
  #
  # Read the note in ci.yml before merging one. Every action here is pinned to the
  # *lowest* major that runs on the current runner Node, not the newest published --
  # the goal is staying off a retired runtime, not chasing releases. A Dependabot PR
  # proposing the newest is a suggestion, not an instruction.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - '*'
