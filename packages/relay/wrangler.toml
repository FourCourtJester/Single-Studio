name = "single-studio-relay"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# One Durable Object per room. Cloudflare guarantees a single instance per name
# globally, so "the room" is one object holding the document rather than a cluster
# with a consensus problem to solve.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# The admin secret guards minting and revoking operator tokens. Set it out of band,
# never in this file, and only the host machine should ever hold it:
#   wrangler secret put RELAY_ADMIN
