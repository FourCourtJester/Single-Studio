<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The logo's S reduced to what survives 16px: a dark ribbon edged in its neon, red
       above and cyan below as in the logo. The dark fill is what keeps it legible on a
       light tab strip; a bare neon stroke washed out there. Colours are the medians of
       the logo's lit tubes. -->
  <defs>
    <linearGradient id="tube" x1="0" y1="8" x2="0" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0.44" stop-color="#f4637a"/>
      <stop offset="0.56" stop-color="#3ee8ee"/>
    </linearGradient>
    <path id="s" d="M46 17.5C42.5 13 37.5 11 32 11 24 11 18 15 18 21.5 18 28 24.5 30 32 32 39.5 34 46 36 46 42.5 46 49 40 53 32 53 26.5 53 21.5 51 18 46.5"/>
  </defs>
  <g fill="none" stroke-linecap="round">
    <use href="#s" stroke="url(#tube)" stroke-width="15"/>
    <use href="#s" stroke="#0e1a20" stroke-width="8"/>
  </g>
</svg>
