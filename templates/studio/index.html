<html lang="en">

         dock and every browser source look identical in the list without it. -->

      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230ea5e9'/%3E%3Crect x='3' y='5' width='10' height='6' rx='1' fill='%23f8fafc'/%3E%3C/svg%3E"
    />

         set from `name` in src/studio/studio.js, per page: the board is your
         studio's name, and each graphic is its own name alongside it. -->
    <title>Loading…</title>
  </head>

    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
