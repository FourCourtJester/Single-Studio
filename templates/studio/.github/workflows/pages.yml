# Publish this studio to GitHub Pages.
#
# Switch Pages to "GitHub Actions" as its source under Settings -> Pages, push to
# the default branch, and the board lands at
# https://<you>.github.io/<this-repo>/#/ -- which is the URL you paste into an OBS
# custom browser dock, and the one every invite link is built from.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # deploy-pages authenticates with OIDC rather than a stored secret.
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No version pinned here: the action reads "packageManager" from
      # package.json, so your machine and this runner cannot drift apart.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # Not `--frozen-lockfile`, and that is for the first push rather than for
      # every one after it. A repository made from this template has no
      # pnpm-lock.yaml until somebody runs an install and commits one, and
      # `--frozen-lockfile` fails outright when there is nothing to freeze -- so the
      # very first deploy would fail, on a project nobody had touched yet, for a
      # reason that reads like a broken template.
      #
      # Nothing is given up. pnpm already turns frozen-lockfile on by itself in CI
      # once a lockfile exists, so this is strict exactly when it can be.
      - run: pnpm install
      - run: pnpm build

      # `base: './'` in vite.config.js is what makes this work under a repo
      # subpath. Nothing here has to know what the repo is called, and the same
      # artifact would serve from a custom domain or straight off a disk.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
