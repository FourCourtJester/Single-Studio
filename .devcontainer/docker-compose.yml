services:
  single-studio:
    build: ./
    command: sleep infinity
    # Host networking is load-bearing, not incidental: OBS WebSocket listens on
    # the host's 127.0.0.1:4455 and BakkesMod on 49122. A bridged container
    # cannot reach either, so those services would fail with nothing obviously
    # wrong to look at.
    network_mode: host
    restart: unless-stopped
    volumes:
      - ..:/usr/src/app:cached
      - ~/.ssh:/home/node/.ssh
